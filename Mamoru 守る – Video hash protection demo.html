<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}

.promise{border-left:4px solid var(--ac);padding:2px 0 2px 12px;margin:0 0 18px;font-weight:600}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}

.tabs button[aria-selected="true"]{background:var(--ac);color:var(--acfg);border-color:var(--ac)}

.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:14px}
.panel[hidden]{display:none}
label.file{display:block;border:2px dashed var(--line);border-radius:10px;padding:22px 12px;text-align:center;cursor:pointer;margin:8px 0}

input[type=file]{display:none}
textarea{width:100%;min-height:70px;font:12px/1.5 ui-monospace,Menlo,monospace;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px;margin:6px 0}
.btn{padding:9px 14px;border:0;background:var(--ac);color:var(--acfg);border-radius:8px;font:inherit;font-weight:600;cursor:pointer;margin:4px 6px 4px 0}
.btn.alt{background:transparent;color:var(--fg);border:1px solid var(--line)}
.res{padding:10px 12px;border-radius:8px;border:1px solid var(--line);margin-top:10px;font-weight:600}
.res.ok{color:var(--ok)}.res.ng{color:var(--warn)}
.post{border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:10px}
.post video{width:100%;max-height:200px;border-radius:6px;background:#000}
.post .gone{padding:22px 10px;text-align:center;color:var(--warn);font-weight:600;background:var(--bg);border-radius:6px}
.log{font:12px/1.6 ui-monospace,Menlo,monospace;color:var(--mute);max-height:150px;overflow:auto;margin-top:10px}
.mute{color:var(--mute);font-size:.88rem}
ol,ul{padding-left:20px;margin:6px 0}
.sw{display:flex;align-items:center;gap:10px;margin:8px 0;font-weight:600}
.sw input{width:20px;height:20px}
code{font:12px ui-monospace,Menlo,monospace;word-break:break-all}
progress{width:100%}
</style>

body{font-family:"Space Grotesk","Noto Sans JP","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;background:radial-gradient(900px 500px at 85% -10%,rgba(34,211,238,.16),transparent 60%),radial-gradient(700px 500px at -10% 30%,rgba(225,29,72,.10),transparent 60%),var(--bg);background-attachment:fixed}

.orb .r2{opacity:.5}
.orb .scan{stroke:var(--ok);animation:sweep 2.6s ease-in-out infinite}

.lang button{background:var(--card);border-radius:99px;backdrop-filter:blur(8px)}
.lang button[aria-pressed="true"]{box-shadow:var(--glow)}
.promise{position:relative;border:1px solid var(--line);border-left:3px solid var(--ac);background:var(--card);border-radius:10px;padding:10px 14px 10px 40px;backdrop-filter:blur(8px)}
.promise::before{content:"⬢";position:absolute;left:13px;top:9px;color:var(--ok);text-shadow:0 0 10px var(--ok)}
.tabs{gap:8px}
.tabs button{border-radius:99px;background:var(--card);backdrop-filter:blur(8px);transition:box-shadow .2s,transform .15s,border-color .2s}
.tabs button:hover{border-color:var(--ac);transform:translateY(-1px)}
.tabs button[aria-selected="true"]{background:linear-gradient(135deg,var(--ac),#38f0c0);box-shadow:var(--glow)}
#t1::before{content:"◈  "}#t2::before{content:"◎  "}#t3::before{content:"✦  "}
.panel{position:relative;background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;box-shadow:var(--glow),inset 0 1px 0 rgba(255,255,255,.06)}
.panel::before,.panel::after{content:"";position:absolute;width:16px;height:16px;border:2px solid var(--ac);pointer-events:none;opacity:.8}
.panel::before{top:-1px;left:-1px;border-right:0;border-bottom:0;border-radius:14px 0 0 0}
.panel::after{bottom:-1px;right:-1px;border-left:0;border-top:0;border-radius:0 0 14px 0}
.panel:not([hidden]){animation:rise .35s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
h2{display:flex;align-items:center;gap:10px}
h2::before{content:"";width:4px;height:1.1em;border-radius:2px;background:linear-gradient(var(--ac),var(--ok));box-shadow:0 0 10px var(--ac)}
label.file{position:relative;overflow:hidden;background:linear-gradient(180deg,rgba(34,211,238,.07),transparent);border:1.5px dashed var(--ac);border-radius:12px;padding:28px 12px;transition:box-shadow .2s,background .2s}
label.file::before{content:"⇪";display:block;font-size:1.7rem;color:var(--ac);text-shadow:0 0 12px var(--ac);margin-bottom:2px}
label.file:hover{box-shadow:var(--glow),inset 0 0 30px rgba(34,211,238,.1)}
label.file:has(+ #busy1:not([hidden]))::after{content:"";position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--ok),transparent);box-shadow:0 0 14px var(--ok);animation:dl 1.1s linear infinite}
@keyframes dl{from{top:0}to{top:100%}}
progress{height:6px;border:0;border-radius:9px;overflow:hidden;background:var(--line);margin-top:8px}
progress::-webkit-progress-bar{background:var(--line)}progress::-webkit-progress-value{background:linear-gradient(90deg,var(--ac),var(--ok));box-shadow:0 0 10px var(--ac)}progress::-moz-progress-bar{background:var(--ac)}
textarea{background:var(--term);color:var(--ok);border:1px solid var(--line);border-radius:10px;box-shadow:inset 0 0 18px rgba(0,0,0,.35)}
#saved{color:var(--ok)}
.btn{background:linear-gradient(135deg,var(--ac),#38f0c0);border-radius:99px;padding:10px 18px;transition:box-shadow .2s,transform .15s}
.btn:hover{box-shadow:var(--glow);transform:translateY(-1px)}.btn:active{transform:translateY(1px)}
.btn.alt{background:transparent;border:1px solid var(--ac);color:var(--ac)}
.sw{padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:rgba(34,211,238,.05)}
.sw input{appearance:none;-webkit-appearance:none;width:48px;height:26px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;transition:background .2s,box-shadow .2s;flex:none}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--fg);transition:transform .2s,background .2s}
.sw input:checked{background:var(--ac);box-shadow:var(--glow)}.sw input:checked::after{transform:translateX(22px);background:var(--acfg)}
#regmsg .res.ok{display:flex;align-items:center;gap:12px;border-color:var(--ok)}
#regmsg .res.ok::before{content:"守";flex:none;display:grid;place-items:center;width:44px;height:44px;border:2px solid #e11d48;border-radius:50%;color:#e11d48;font-weight:700;font-size:1.3rem;transform:rotate(-8deg);animation:stamp .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes stamp{from{transform:scale(2.6) rotate(-8deg);opacity:0}}
.res{border-radius:10px;backdrop-filter:blur(6px)}
#guide h2{margin-top:16px}
#guide li{margin:4px 0}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:480px){.orb{width:64px;height:64px}.hero .kanji{font-size:4.5rem}}
.support{border-color:rgba(52,245,197,.38);background:linear-gradient(145deg,rgba(10,35,43,.88),var(--card))}
.support .intro{max-width:62ch;color:var(--mute);margin:0 0 14px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin:12px 0}
.choice{min-height:46px;border:1px solid var(--line);border-radius:10px;background:rgba(34,211,238,.05);color:var(--fg);padding:10px;text-align:left;font:inherit;font-weight:600;cursor:pointer}
.choice:hover,.choice[aria-pressed="true"]{border-color:var(--ac);box-shadow:var(--glow)}
.choice[aria-pressed="true"]{background:rgba(34,211,238,.14)}
.guide-result{border:1px solid var(--line);border-radius:12px;padding:14px;background:rgba(0,0,0,.16);margin-top:12px}
.guide-result h3{margin:0 0 8px;font-size:1rem}
.guide-result li{margin:6px 0}
.guide-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.guide-links a{color:var(--ac);font-weight:700;text-underline-offset:3px}
.saved-row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding:6px 0}
.safe-note strong{margin-right:.3em}
.safe-note{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.025);color:var(--mute);font-size:.88rem}
.consent{align-items:flex-start;font-size:.88rem;font-weight:500}
.consent input{margin-top:2px}
.small{font-size:.78rem;color:var(--mute)}
.btn:disabled{opacity:.5;cursor:not-allowed;filter:grayscale(.4)}
.assistant-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.assistant-grid label{display:grid;gap:4px;color:var(--mute);font-size:.82rem;font-weight:600}
.assistant-grid input,.assistant-question{width:100%;border:1px solid var(--line);border-radius:9px;background:var(--term);color:var(--fg);font:inherit;padding:9px 11px}
.assistant-question{min-height:84px;margin:8px 0}
.assistant-status{min-height:1.5em;margin:8px 0;color:var(--mute);font-size:.86rem}
.assistant-status.error{color:var(--warn)}
.assistant-status.ok{color:var(--ok)}
.assistant-answer{white-space:pre-wrap;overflow-wrap:anywhere;border:1px solid var(--line);border-radius:10px;background:rgba(0,0,0,.16);padding:12px;margin-top:10px}
.assistant-answer:empty{display:none}
@media(max-width:480px){.assistant-grid{grid-template-columns:1fr}}
[hidden]{display:none!important}
</style>

let lang="en";const t=k=>L[lang][k];
const REGISTRY_KEY="mamoru.local-fingerprints.v1";
const MAX_FILE_SIZE=100*1024*1024;
const registry=[];

function setStatus(target,message,kind="ok"){
 const node=$(target);node.replaceChildren();
 if(!message)return;
 const box=document.createElement("div");box.className=`res ${kind}`;box.textContent=message;node.append(box);
}
function isValidHash(hash){
 return !!hash&&hash.version===1&&(hash.sha256===null||/^[a-f0-9]{64}$/.test(hash.sha256))&&
  Array.isArray(hash.frames)&&hash.frames.length===8&&hash.frames.every(frame=>/^[a-f0-9]{16}$/.test(frame));
}
function saveRegistry(){
 try{localStorage.setItem(REGISTRY_KEY,JSON.stringify(registry));return true}
 catch(error){setStatus("regmsg",t("storageError"),"ng");return false}
}
function loadRegistry(){
 try{
  const raw=localStorage.getItem(REGISTRY_KEY);if(!raw)return;
  const saved=JSON.parse(raw);
  if(!Array.isArray(saved))throw new Error("Invalid local registry");
  saved.slice(0,100).forEach(entry=>{
   if(entry&&typeof entry.id==="string"&&isValidHash(entry.hash))registry.push(entry);
  });
 }catch(error){setStatus("regmsg",t("storageError"),"ng")}
}
function renderReg(){
 const root=$("regList");root.replaceChildren();
 if(!registry.length){root.textContent=t("regEmpty");return}
 registry.forEach(entry=>{
  const row=document.createElement("div");row.className="saved-row";
  const label=document.createElement("span");label.textContent=`#${entry.id} ${(entry.hash.sha256||entry.hash.frames[0]).slice(0,24)}… `;
  const remove=document.createElement("button");remove.type="button";remove.className="btn alt";remove.dataset.removeId=entry.id;remove.textContent=t("remove");
  row.append(label,remove);root.append(row);
 });
}

function selectTab(id,focus=false){

  const active=number===id;
  $("t"+number).setAttribute("aria-selected",String(active));
  $("t"+number).tabIndex=active?0:-1;
  $("p"+number).hidden=!active;
 });

}

document.querySelector(".tabs").addEventListener("keydown",event=>{

 if(currentIndex<0)return;
 let next=currentIndex;
 if(event.key==="ArrowRight")next=(currentIndex+1)%tabs.length;
 else if(event.key==="ArrowLeft")next=(currentIndex+tabs.length-1)%tabs.length;
 else if(event.key==="Home")next=0;
 else if(event.key==="End")next=tabs.length-1;
 else return;
 event.preventDefault();selectTab(tabs[next],true);
});

/* Local Ollama helper */
function ollamaBaseUrl(){
 const raw=$("ollamaAddress").value.trim();
 let endpoint;
 try{endpoint=new URL(raw)}catch(error){throw new Error(t("assistantAddressInvalid"))}
 if(endpoint.protocol!=="http:"||!["localhost","127.0.0.1","[::1]"].includes(endpoint.hostname)||
    endpoint.username||endpoint.password||endpoint.pathname!=="/"||endpoint.search||endpoint.hash){
  throw new Error(t("assistantAddressLocalOnly"))
 }
 return endpoint.origin;
}
function ollamaModelName(){
 const model=$("ollamaModel").value.trim();
 if(!/^[a-zA-Z0-9._:-]+$/.test(model))throw new Error(t("assistantModelNeeded"));
 return model;
}
async function ollamaRequest(path,options={}){
 const controller=new AbortController();
 const timeout=setTimeout(()=>controller.abort(),120000);
 try{
  const response=await fetch(`${ollamaBaseUrl()}${path}`,{...options,signal:controller.signal});
  if(!response.ok)throw new Error(`Ollama returned HTTP ${response.status}.`);
  return await response.json();
 }catch(error){
  if(error.name==="AbortError")throw new Error(t("assistantTimeout"));
  throw error;
 }finally{clearTimeout(timeout)}
}
async function checkLocalOllama(){
 const status=$("assistantStatus"),button=$("checkOllama");
 status.className="assistant-status";status.textContent=t("assistantChecking");
 button.disabled=true;
 try{
  const model=ollamaModelName();
  const data=await ollamaRequest("/api/tags");
  if(!Array.isArray(data.models))throw new Error("Ollama returned an invalid model list.");
  const names=data.models.map(entry=>entry.name).filter(name=>typeof name==="string");
  const installed=names.some(name=>name===model||(name===`${model}:latest`&&!model.includes(":")));
  status.className=`assistant-status ${installed?"ok":"error"}`;
  status.textContent=installed?t("assistantCheckReady"):`${t("assistantModelMissing")}${names.join(", ")||"none"}`;
 }catch(error){
  status.className="assistant-status error";
  if(error instanceof Error&&(error.message===t("assistantAddressInvalid")||error.message===t("assistantAddressLocalOnly"))){
   status.textContent=error.message;
  }else{
   status.textContent=`${t("assistantUnavailable")} ${error instanceof Error?error.message:""}`.trim();
  }
 }finally{button.disabled=false}
}

  if(!Array.isArray(tags.models))throw new Error("Ollama returned an invalid model list.");
  const names=tags.models.map(entry=>entry.name).filter(name=>typeof name==="string");
  if(!names.some(name=>name===model||(name===`${model}:latest`&&!model.includes(":")))){
   throw new Error(`${t("assistantModelMissing")}${names.join(", ")||"none"}`);
  }
  const situation=selectedSituation?`Selected situation: ${selectedSituation}.`:"No situation selected.";
  const age=selectedAge?`Age context: ${selectedAge}.`:"Age context not selected.";
  const system=`You are Mamoru's calm, practical local safety guide. Respond in ${lang==="ja"?"Japanese":"English"} in plain, concise language. Give 2-5 safe, actionable steps and acknowledge uncertainty. Never ask for names, account identifiers, URLs, images, videos, or other identifying details. Never ask the user to upload, download, forward, hash, or share intimate content. If the user says anyone was under 18 when recorded, clearly tell them not to view, copy, download, share, or hash the content; suggest a trusted adult and appropriate local authorities/support. If danger is immediate, advise contacting local emergency services (110 in Japan). Do not claim to verify identity, consent, legality, or whether content is authentic. Do not promise removal or platform blocking. You are not an emergency, legal, or mental-health service; direct urgent/sensitive cases to official support. The app's fixed guidance takes priority over speculation. ${situation} ${age}`;
  const data=await ollamaRequest("/api/chat",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({model,stream:false,messages:[{role:"system",content:system},{role:"user",content:question}],options:{temperature:0.2,num_predict:400}})
  });
  const reply=data?.message?.content?.trim();
  if(!reply)throw new Error(t("assistantNoReply"));
  answer.textContent=reply;
  status.className="assistant-status ok";status.textContent=t("assistantCheckReady");
 }catch(error){
  status.className="assistant-status error";
  status.textContent=`${t("assistantError")} ${error instanceof Error?error.message:t("assistantUnavailable")}`;
 }finally{button.disabled=false;$("checkOllama").disabled=false}
}

$("askAssistant").addEventListener("click",askLocalOllama);
$("assistantQuestion").addEventListener("keydown",event=>{
 if(event.key==="Enter"&&(event.ctrlKey||event.metaKey)){event.preventDefault();askLocalOllama()}
});

/* Local video fingerprinting */
async function sha256(file){
 if(!crypto.subtle)throw new Error("Secure browser cryptography is unavailable. Open this file in a current browser.");
 const digest=await crypto.subtle.digest("SHA-256",await file.arrayBuffer());
 return[...new Uint8Array(digest)].map(byte=>byte.toString(16).padStart(2,"0")).join("");
}
function seek(video,seconds){
 return new Promise((resolve,reject)=>{
  const timeout=setTimeout(()=>finish(new Error("Video seeking timed out")),15000);
  const finish=error=>{
   clearTimeout(timeout);video.removeEventListener("seeked",onSeeked);video.removeEventListener("error",onError);
   error?reject(error):resolve();
  };
  const onSeeked=()=>finish();const onError=()=>finish(new Error("Video decoding failed"));
  video.addEventListener("seeked",onSeeked,{once:true});video.addEventListener("error",onError,{once:true});
  try{video.currentTime=seconds}catch(error){finish(error)}
 });
}
async function frameHashes(file,onProgress){
 const video=document.createElement("video"),url=URL.createObjectURL(file);
 video.muted=true;video.preload="auto";video.playsInline=true;video.src=url;
 try{
  await new Promise((resolve,reject)=>{
   const timeout=setTimeout(()=>reject(new Error("Video loading timed out")),15000);
   video.onloadedmetadata=()=>{clearTimeout(timeout);resolve()};
   video.onerror=()=>{clearTimeout(timeout);reject(new Error("Video decoding failed"))};
  });
  if(!Number.isFinite(video.duration)||video.duration<=0)throw new Error("This video has no readable duration.");
  const canvas=document.createElement("canvas");canvas.width=9;canvas.height=8;
  const context=canvas.getContext("2d",{willReadFrequently:true});
  if(!context)throw new Error("Canvas processing is unavailable.");
  const frames=[];
  for(let index=0;index<8;index++){
   await seek(video,video.duration*(index+.5)/8);
   context.drawImage(video,0,0,9,8);
   const data=context.getImageData(0,0,9,8).data;let bits="";
   for(let y=0;y<8;y++)for(let x=0;x<8;x++){
    const gray=column=>{const offset=(y*9+column)*4;return .299*data[offset]+.587*data[offset+1]+.114*data[offset+2]};
    bits+=gray(x)>gray(x+1)?"1":"0";
   }
   let frame="";
   for(let offset=0;offset<64;offset+=4)frame+=parseInt(bits.slice(offset,offset+4),2).toString(16);
   frames.push(frame);onProgress?.((index+1)*12.5);
  }
  return frames;
 }finally{
  video.removeAttribute("src");video.load();URL.revokeObjectURL(url);
 }
}
async function makeHash(file,onProgress){
 if(file.size>MAX_FILE_SIZE)throw new Error(t("sizeError"));
 if(file.type&&!file.type.startsWith("video/"))throw new Error(t("videoError"));
 const frames=await frameHashes(file,onProgress);
 return{version:1,sha256:await sha256(file),frames};
}
function hammingDistance(left,right){
 let total=0;
 for(let index=0;index<left.length;index++){
  let value=parseInt(left[index],16)^parseInt(right[index],16);
  while(value){total+=value&1;value>>=1}
 }
 return total;
}
function compare(left,right){
 if(!isValidHash(left)||!isValidHash(right))throw new Error(t("needHash"));
 const exact=!!left.sha256&&!!right.sha256&&left.sha256===right.sha256;
 const bits=left.frames.length*64;
 const distance=left.frames.reduce((sum,frame,index)=>sum+hammingDistance(frame,right.frames[index]),0);
 return{exact,similarity:Math.round((1-distance/bits)*100)};
}

$("reg").addEventListener("click",()=>{

 const entry={id:crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random().toString(16).slice(2)}`,hash:current};
 registry.push(entry);
 if(!saveRegistry()){registry.pop();return}
 renderReg();setStatus("regmsg",t("registered"));
});

$("f3").addEventListener("change",async event=>{

  const message=result.exact?t("same"):result.similarity>=88?`${t("likely")} (${t("sim")}: ${result.similarity}%)`:`${t("notsame")} (${t("sim")}: ${result.similarity}%)`;
  setStatus("res3",message,result.exact?"ok":result.similarity>=88?"ng":"ok");
 }catch(error){setStatus("res3",error instanceof Error?error.message:t("needHash"),"ng")}
});
